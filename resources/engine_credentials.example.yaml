# Amass Engine control-plane credentials.
#
# This file is referenced by the AMASS_ENGINE_CREDENTIALS environment
# variable. Without it, the engine refuses to bind any non-loopback address
# and runs in loopback-only open mode with a startup warning.
#
# Fields:
#   id         credential identifier (HTTP Basic Auth username)
#   secret     shared secret (HTTP Basic Auth password); min 16 bytes
#   expiresAt  optional RFC3339 instant after which the credential is rejected
#   readOnly   optional; when true the credential may only perform reads
#   sessions   optional list of session UUIDs the credential may access;
#              omit to grant access to every session
credentials:
  - id: admin
    secret: change-me-to-a-long-random-secret
    # Full access, no session restriction, no expiry.

  - id: viewer
    secret: change-me-too-also-long-random
    readOnly: true
    # Read-only access to every session.

  # Example of a session-scoped, expiring credential:
  # - id: scoped-team-a
  #   secret: another-long-random-secret-value
  #   expiresAt: 2027-01-01T00:00:00Z
  #   sessions:
  #     - 11111111-1111-1111-1111-111111111111
